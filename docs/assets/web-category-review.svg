  <rect x="144" y="354" width="1192" height="418" rx="12" fill="#fff" stroke="#d9deea"/>
  <rect x="144" y="354" width="1192" height="67" rx="12" fill="#edf5ff"/>
  <rect x="144" y="396" width="1192" height="25" fill="#edf5ff"/>
