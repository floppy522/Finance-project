<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Moneyflow transaction category review</title>
  <desc id="desc">A synthetic dashboard view showing the Moneyflow transaction table, category and review filters, and three categorized operations.</desc>
  <defs>
    <filter id="panel-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2b3850" flood-opacity=".08"/>
    </filter>
    <style>
      .system { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 800; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f6f7fb"/>
  <rect x="92" y="62" width="1256" height="776" rx="20" fill="#fff" stroke="#d9deea" filter="url(#panel-shadow)"/>
  <text x="144" y="133" class="system title" fill="#1d2433">Moneyflow</text>
  <text x="144" y="164" class="system body" fill="#667085">Операции</text>

