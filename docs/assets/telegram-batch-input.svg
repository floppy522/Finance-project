  <rect x="480" y="63" width="200" height="31" rx="15.5" fill="#e8f2ff" stroke="#bdd6f7"/>
  <text x="580" y="84" class="system small bold" text-anchor="middle" fill="#124d91">Synthetic demo data</text>
