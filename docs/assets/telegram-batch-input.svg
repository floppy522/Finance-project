    <text x="552" y="498" class="system small" text-anchor="end" fill="#356b44">09:41</text>

    <rect x="141" y="540" width="438" height="207" rx="18" fill="#fff"/>
    <text x="164" y="571" class="system bold body" fill="#26333e">15 июля 2026</text>
    <text x="164" y="599" class="system body" fill="#26333e">−350,00 ₽ · Кафе и рестораны · кофе</text>
    <text x="164" y="627" class="system body" fill="#26333e">−780,00 ₽ · Транспорт · такси</text>
    <line x1="164" y1="644" x2="556" y2="644" stroke="#d2d8df"/>
    <text x="164" y="676" class="system bold body" fill="#26333e">16 июля 2026</text>
    <text x="164" y="704" class="system body" fill="#26333e">+150 000,00 ₽ · Зарплата · зарплата</text>
    <text x="557" y="733" class="system small" text-anchor="end" fill="#526875">09:41 ✓✓</text>
